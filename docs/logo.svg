<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="72" height="72" role="img" aria-label="accounts-portal">
  <!-- The badge: its band cycles through the states the pages show (in progress, success, failure). -->
  <defs>
    <clipPath id="badge"><rect x="8" y="4" width="48" height="56" rx="10"/></clipPath>
    <mask id="slot">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="24" y="11" width="16" height="5" rx="2.5" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#slot)">
    <rect x="8" y="4" width="48" height="56" rx="10" fill="#2c4fb8"/>
    <rect x="8" y="4" width="48" height="19" clip-path="url(#badge)" fill="#8ea6f0">
      <animate attributeName="fill" dur="4.5s" repeatCount="indefinite"
        values="#8ea6f0;#8ea6f0;#6fcf9f;#6fcf9f;#f08a7e;#f08a7e;#8ea6f0"
        keyTimes="0;0.25;0.33;0.58;0.66;0.91;1"/>
    </rect>
    <rect x="17" y="32" width="30" height="4" rx="2" fill="#fff" opacity=".9"/>
    <rect x="17" y="41" width="20" height="4" rx="2" fill="#fff" opacity=".55"/>
  </g>
</svg>
